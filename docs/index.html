<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swiss Transport Accessibility</title>

  <!-- Include Leaflet CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        crossorigin integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H">

  <!-- Include custom CSS -->
  <link rel="stylesheet" href="global.css">

  <!-- Include Phosphor Icons -->
  <script src="https://unpkg.com/phosphor-icons"></script>
</head>

<body>
  
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <h1>Swiss Transport Accessibility</h1>
          <p>IC Hub Connectivity Dashboard</p>
        </div>
      </div>

      <div class="topbar-nav">
        <button class="view-tab active" type="button">
          <i class="ph-map-trifold"></i>
          <span>Map View</span>
        </button>
        <button class="view-tab" type="button">
          <i class="ph-chart-bar"></i>
          <span>Analysis</span>
        </button>
      </div>
    </header>

    <main class="main-content">
      <div id="mapid"></div>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Include JavaScripts-->
  <script src="js/map.js"></script>
</body>

</html>
