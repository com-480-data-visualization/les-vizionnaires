<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swiss Transport Accessibility</title>

  <!-- Include Leaflet CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        crossorigin integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H">

  <!-- Include custom CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/panels.css">

  <!-- Include Phosphor Icons -->
  <script src="https://unpkg.com/phosphor-icons"></script>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <h1>Swiss Transport Accessibility</h1>
          <p>IC Hub Connectivity Dashboard</p>
        </div>
      </div>

      <div class="topbar-nav">
        <button class="view-tab active" type="button">
          <i class="ph-map-trifold"></i>
          <span>Map View</span>
        </button>
        <button class="view-tab" type="button">
          <i class="ph-chart-bar"></i>
          <span>Analysis</span>
        </button>
      </div>
    </header>

    <main class="main-content">
      <div id="mapid"></div>
    </main>

    <aside class="right-panel">
      <div class="right-panel__header">
        <h2>Accessibility Control</h2>
        <p>Explore reachability and routes</p>
      </div>

      <div class="right-panel__body">
        <section class="control-section">
          <h3>Mode</h3>

          <fieldset class="mode-group">
            <legend class="sr-only">Accessibility mode</legend>

            <label class="radio-card">
              <input type="radio" name="mode" value="fromA" checked>
              <span class="radio-ui"></span>
              <span class="radio-label">Where can I go from A?</span>
            </label>

            <label class="radio-card">
              <input type="radio" name="mode" value="routeAB">
              <span class="radio-ui"></span>
              <span class="radio-label">Route from A to B</span>
            </label>
          </fieldset>
        </section>

        <section class="control-section">
          <label class="field-label" for="pointA">
            <span class="field-icon">⌖</span>
            <span>Point A</span>
          </label>

          <input
            id="pointA"
            class="text-input"
            type="text"
            placeholder="Click map or search..."
          >
        </section>

        <section class="control-section">
          <label class="field-label">
            <span class="field-icon">◔</span>
            <span>Max Travel Time</span>
          </label>

          <div class="segmented-group" id="travelTimeGroup">
            <button class="time-chip" type="button" data-time="15">15 min</button>
            <button class="time-chip active" type="button" data-time="30">30 min</button>
            <button class="time-chip" type="button" data-time="60">60 min</button>
          </div>
        </section>

        <section class="control-section">
          <label class="field-label" for="departureTime">Departure Time</label>
           <input
            id="departureTime"
            class="text-input time-input"
            type="time"
            value="09:00"
            min="00:00"
            max="23:59"
            step="60"
            required
          >
        </section>
      </div>

      <button class="help-button" type="button" aria-label="Help">?</button>
    </aside>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Include custom JS -->
  <script src="js/controls-right.js"></script>
  <script src="js/map.js"></script>
</body>

</html>
